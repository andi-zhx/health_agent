name: Startup regression
on:
  push:
  pull_request:
jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.10'
          - os: windows-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
          - os: ubuntu-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Windows double-click setup path
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python bootstrap.py --install-only
          call start.bat --install-only
